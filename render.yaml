services:
  - type: web
    name: jt-sla-dashboard
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JT_API_URL
        value: https://jt-api.rockettechbr.com.br
      - key: JT_API_KEY
        sync: false
