services:
  - type: web
    name: jt-sla-dashboard
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_drive:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: JT_TIMEZONE
        value: America/Belem
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1pIXZ5unObZaSJPHlt65hwTMHXI-UOs8U
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-drive.json
      - key: DRIVE_CACHE_SECONDS
        value: '300'
      - key: DRIVE_MAX_FILE_MB
        value: '25'
      - key: DRIVE_MAX_TOTAL_MB
        value: '150'
